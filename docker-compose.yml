# Tout le système en une commande :  docker compose up -d --build
#   Interface  http://localhost:8501
#   API        http://localhost:8000/docs   (passerelle nginx -> N copies de l'API)
#   MLflow     http://localhost:5000
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000  (admin / admin)
#
# Réglages (variables d'environnement ou fichier .env) :
#   API_REPLICAS=3     nombre de copies de l'API (scaling horizontal)
#   CANARY_WEIGHT=0.1  part du trafic envoyée au modèle « challenger » (canary)
#   ORT_THREADS=2      cœurs utilisés par chaque copie (0 = tous)

name: real-or-ai

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "localhost:5000,127.0.0.1:5000,mlflow:5000,localhost:5001,127.0.0.1:5001"
    environment:
      # Pas de processus de « jobs » MLflow (fonctions GenAI inutiles ici) : ~10 processus et 2 Go de RAM en moins
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realorai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realorai}
      POSTGRES_DB: realorai
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "realorai"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: real-or-ai
      MODEL_ALIAS: champion
      CANARY_ALIAS: challenger
      CANARY_WEIGHT: ${CANARY_WEIGHT:-0}
      ORT_THREADS: ${ORT_THREADS:-0}
      DATABASE_URL: postgresql+psycopg://realorai:${POSTGRES_PASSWORD:-realorai}@postgres:5432/realorai
    deploy:
      replicas: ${API_REPLICAS:-1}
    depends_on:
      mlflow: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # Point d'entrée unique : répartit les requêtes entre les copies de l'API (round robin)
  gateway:
    image: nginx:1.29.3-alpine
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8000:80"]
    depends_on: [api]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      API_URL: http://gateway
    ports: ["8501:8501"]
    depends_on: [gateway]
    restart: unless-stopped

  drift:
    build:
      context: .
      dockerfile: monitoring/drift/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql+psycopg://realorai:${POSTGRES_PASSWORD:-realorai}@postgres:5432/realorai
      DRIFT_INTERVAL: ${DRIFT_INTERVAL:-30}
    depends_on:
      mlflow: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  # Test de charge (ne démarre pas avec « up ») :
  #   docker compose --profile loadtest run --rm locust
  # Réglages : USERS, SPAWN_RATE, RUN_TIME, REPORT (nom du rapport)
  # Contre la production : TARGET_HOST=http://<IP-VM> KEYS_FILE=loadtest/.keys.prod.env
  locust:
    image: locustio/locust:2.42.2
    profiles: [loadtest]
    working_dir: /mnt
    volumes:
      - ./loadtest:/mnt/loadtest
      - ./data/samples:/mnt/data/samples:ro
    env_file: ["${KEYS_FILE:-loadtest/.keys.env}"]
    environment:
      USERS: ${USERS:-40}
      SPAWN_RATE: ${SPAWN_RATE:-0.25}
      RUN_TIME: ${RUN_TIME:-3m}
      TARGET_HOST: ${TARGET_HOST:-http://gateway}
      REPORT: ${REPORT:-run}
    entrypoint: ["sh", "-c"]
    command:
      - >
        API_KEYS="$$ALICE_KEY,$$BOB_KEY" locust -f loadtest/locustfile.py --host $$TARGET_HOST
        --headless --users $$USERS --spawn-rate $$SPAWN_RATE --run-time $$RUN_TIME
        --csv loadtest/reports/$$REPORT --csv-full-history --html loadtest/reports/$$REPORT.html --only-summary
    depends_on: [gateway]

volumes:
  postgres-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
