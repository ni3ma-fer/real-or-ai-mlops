global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  # Découverte par DNS : Prometheus relève CHAQUE copie de l'API, même quand on en ajoute
  - job_name: api
    metrics_path: /metrics/
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: drift
    static_configs:
      - targets: ["drift:8001"]
