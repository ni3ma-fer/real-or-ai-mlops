# Passerelle : répartit les requêtes entre toutes les copies du service « api » (round robin).
# « resolve » : nginx redemande régulièrement au DNS de Docker la liste des copies,
# donc ajouter ou retirer des copies (docker compose up --scale api=N) ne demande aucun redémarrage.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 11m;

    # Les compteurs internes ne sont pas exposés au public (Prometheus les lit directement)
    location /metrics { return 404; }

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        # Si une copie tombe pendant une requête, nginx la rejoue sur une autre copie.
        # Sans risque ici : une prédiction peut être recalculée (pas d'effet de bord).
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 3;
        add_header X-Upstream $upstream_addr always;
    }
}
